name: Validate tracker
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm run check
      - run: dotnet run --project tests/Smoke/Smoke.csproj -c Release -m:1
      - run: npx wrangler deploy --config v3/web-cloud/wrangler.toml --dry-run

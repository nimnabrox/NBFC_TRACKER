name: Release NBFC TRACKER
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-and-release:
    if: github.event.deleted != true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - name: Verify source and tag version
        run: node scripts/version.mjs --check --tag "${{ github.ref_name }}"
      - run: npm run check
      - name: Verify desktop behavior
        run: dotnet run --project tests/Smoke/Smoke.csproj -c Release -m:1
      - name: Build release assets
        shell: pwsh
        run: |
          $releaseVersion = '${{ github.ref_name }}'.TrimStart('v')
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Tag must be vX.Y.Z' }
          dotnet publish src/ChestCounter/ChestCounter.csproj -c Release -r win-x64 --self-contained true -m:1 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=false -p:DebugType=none -o dist/release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run package:web
          Copy-Item 'dist/release/NBFC TRACKER.exe' 'dist/release/NBFC.TRACKER.exe'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/web/* -DestinationPath dist/release/NBFC-Tracker-Web.zip
          Get-FileHash 'dist/release/NBFC.TRACKER.exe', 'dist/release/NBFC-Tracker-Web.zip' -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/release/SHA256SUMS.txt
      - name: Verify standalone executable dependencies
        shell: pwsh
        run: ./scripts/test-portable-build.ps1
      - uses: softprops/action-gh-release@v2
        with:
          name: NBFC TRACKER ${{ github.ref_name }}
          body: |
            Desktop app, website and release use one shared version.

            - Original dashboard and OBS overlay, with optional caption and last-match details.
            - 18 languages, readable language controls and Fortnite typography.
            - Subscribe and NIMNABRO creator-code controls.
            - Clean OBS URLs, remembered overlay totals and verified GitHub downloads.
            - One stable overlay URL that follows saved settings, language and profile changes.
            - Frontend-only Cloudflare hosting; live updates stay on the same PC with no cloud API polling.
            - Download homepage with setup instructions, source links and download-verification information.
            - Saved app zoom from 50% to 150%, with a 100% reset.
            - Non-shrinking app cards, automatic dashboard reconnect and changing homepage demo counters.
            - Self-contained Windows executable with embedded UI/languages and a browser fallback when WebView2 is missing.
            - Automated UI, version consistency, profile and download-integrity checks.
          generate_release_notes: true
          files: |
            dist/release/NBFC.TRACKER.exe
            dist/release/NBFC-Tracker-Web.zip
            dist/release/SHA256SUMS.txt
            v3/public/version.json

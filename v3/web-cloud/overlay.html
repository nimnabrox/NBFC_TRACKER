<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NBFC TRACKER Overlay - Created by NimnaBro</title>
  <link rel="icon" type="image/png" href="assets/chest_fnv1.png">
  <link rel="shortcut icon" type="image/png" href="assets/chest_fnv1.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background: transparent !important;
      overflow: hidden;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 4px;
      font-family: 'Montserrat', 'Segoe UI Black', 'Impact', system-ui, sans-serif;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 10px 24px 10px 14px;
      background: #1c1f26;
      border: 2px solid #f5a623;
      border-radius: 20px;
      box-shadow: inset 0 0 16px rgba(245, 166, 35, 0.28);
      overflow: hidden;
      user-select: none;
    }
    .chest-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }
    .chest-halo {
      position: absolute;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 166, 35, 0.65) 0%, rgba(245, 166, 35, 0.25) 45%, rgba(245, 166, 35, 0) 72%);
      filter: blur(4px);
      pointer-events: none;
    }
    .chest-img {
      position: relative;
      width: 60px;
      height: 60px;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6));
    }
    .divider {
      width: 2px;
      height: 48px;
      background: rgba(255, 255, 255, 0.16);
      margin: 0 18px 0 14px;
      flex-shrink: 0;
    }
    .stat-box {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .counter {
      font-size: 52px;
      font-weight: 900;
      line-height: 1;
      color: #f7a81b;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      text-shadow: 0 0 18px rgba(247, 168, 27, 0.65), 0 2px 4px rgba(0, 0, 0, 0.9);
      transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
  </style>
</head>
<body>
  <div class="pill">
    <div class="chest-box">
      <div class="chest-halo"></div>
      <img src="assets/chest_fnv1.png" onerror="this.onerror=null;this.src='public/assets/chest_fnv1.png'" alt="Chest" class="chest-img">
    </div>
    <div class="divider"></div>
    <div class="stat-box">
      <div id="total" class="counter">0</div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const room = (urlParams.get('room') || 'nimnabro').toLowerCase();
    const el = document.getElementById('total');
    let lastTotal = null;
    let animTimeout = null;

    function updateTotal(val) {
      const num = Number(val);
      if (isNaN(num)) return;
      if (num !== lastTotal) {
        lastTotal = num;
        el.textContent = num.toLocaleString('en-US');
        el.style.transform = 'scale(1.10)';
        if (animTimeout) clearTimeout(animTimeout);
        animTimeout = setTimeout(() => { el.style.transform = 'scale(1)'; }, 180);
      }
    }

    // 1. BroadcastChannel (0ms memory sync from local browser tab)
    try {
      if (typeof BroadcastChannel !== 'undefined') {
        const bc = new BroadcastChannel('nb_chest_sync_' + room);
        bc.onmessage = (e) => {
          if (e.data && e.data.total !== undefined) updateTotal(e.data.total);
        };
      }
    } catch (e) {}

    // 2. LocalStorage Storage event (Cross-window persistence)
    window.addEventListener('storage', (e) => {
      if (e.key === 'nb_chest_state_' + room && e.newValue) {
        try {
          const d = JSON.parse(e.newValue);
          if (d.total !== undefined) updateTotal(d.total);
        } catch {}
      }
    });

    // 3. Ultra-efficient Auto-Connecting Poller
    let isPolling = false;
    async function poll() {
      if (isPolling) return;
      isPolling = true;

      let localSucceeded = false;

      // Try local daemon first (0ms latency if running on PC)
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 600);
        const res = await fetch('http://localhost:5088/api/live', { signal: ctrl.signal });
        clearTimeout(tid);
        if (res.ok) {
          const d = await res.json();
          if (d && d.total !== undefined) {
            updateTotal(d.total);
            localSucceeded = true;
          }
        }
      } catch {}

      if (!localSucceeded) {
        try {
          const ctrl = new AbortController();
          const tid = setTimeout(() => ctrl.abort(), 600);
          const res = await fetch('http://127.0.0.1:5088/api/live', { signal: ctrl.signal });
          clearTimeout(tid);
          if (res.ok) {
            const d = await res.json();
            if (d && d.total !== undefined) {
              updateTotal(d.total);
              localSucceeded = true;
            }
          }
        } catch {}
      }

      // If local not reached or HTTPS mixed-content restricted, ALWAYS query Cloudflare Edge /api/sync
      if (!localSucceeded) {
        try {
          const ctrl = new AbortController();
          const tid = setTimeout(() => ctrl.abort(), 1000);
          const baseApi = (window.location.origin && window.location.origin.startsWith('http') && !window.location.origin.includes(':5088'))
            ? window.location.origin
            : 'https://nbfct.nimnabro.com';
          const res = await fetch(`${baseApi}/api/sync?room=${encodeURIComponent(room)}`, {
            cache: 'no-store',
            signal: ctrl.signal
          });
          clearTimeout(tid);
          if (res.ok) {
            const d = await res.json();
            if (d && d.total !== undefined) {
              updateTotal(d.total);
            }
          }
        } catch {}
      }

      isPolling = false;
    }

    // Auto-connect loop: runs every 800ms so when app starts it auto-detects without refresh!
    setInterval(poll, 800);
    poll();
  </script>
</body>
</html>
